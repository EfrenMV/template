<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cart - HexaShop</title>
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/font-awesome.css">
  <link rel="stylesheet" href="assets/css/templatemo-hexashop.css">
</head>
<body>

  <!-- Header -->
  <header class="header-area header-sticky">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <nav class="main-nav">
            <a href="index.html" class="logo">
              <img src="assets/images/logo.png" alt="HexaShop Logo">
            </a>
            <ul class="nav">
              <li><a href="index.html">Home</a></li>
              <li><a href="#men">Men's</a></li>
              <li><a href="#women">Women's</a></li>
              <li><a href="#kids">Kid's</a></li>
              <li><a href="cart.html" class="active"><i class="fa fa-shopping-cart"></i> Cart</a></li>
            </ul>
            <a class='menu-trigger'><span>Menu</span></a>
          </nav>
        </div>
      </div>
    </div>
  </header>

  <!-- Cart Content -->
  <section class="section" style="margin-top: 100px;">
    <div class="container">
      <h2 class="text-center mb-5">Your Shopping Cart</h2>
      <div class="row">
        <div class="col-lg-12">
          <table class="table table-bordered table-hover">
            <thead class="thead-dark">
              <tr>
                <th>Product</th>
                <th>Name</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="cart-items">
              <!-- JS will inject cart items here -->
            </tbody>
          </table>
          <div class="text-right">
            <h4 id="cart-total">Total: $0.00</h4>
            <a href="#" class="btn btn-primary">Checkout</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    // Dummy example cart
    const cartItems = [
      { name: "Classic Spring", price: 120, qty: 1, image: "assets/images/men-01.jpg" },
      { name: "Air Force 1X", price: 90, qty: 2, image: "assets/images/men-02.jpg" }
    ];

    const tbody = document.getElementById('cart-items');
    const total = document.getElementById('cart-total');

    let sum = 0;
    cartItems.forEach(item => {
      const row = document.createElement('tr');
      const subtotal = item.price * item.qty;
      sum += subtotal;

      row.innerHTML = `
        <td><img src="${item.image}" width="80" /></td>
        <td>${item.name}</td>
        <td>$${item.price.toFixed(2)}</td>
        <td>${item.qty}</td>
        <td>$${subtotal.toFixed(2)}</td>
        <td><button class="btn btn-danger btn-sm">Remove</button></td>
      `;
      tbody.appendChild(row);
    });

    total.textContent = "Total: $" + sum.toFixed(2);
  </script>
</body>
</html>
